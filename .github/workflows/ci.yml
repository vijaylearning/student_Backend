name: CI - Autograde

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Run tests (produce surefire reports even on failures)
        run: mvn -B -DskipTests=false test || true

      - name: Generate grade.json from surefire reports
        run: python3 .github/scripts/parse_surefire.py target/surefire-reports || true

      - name: Upload grade.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: grade
          path: grade.json

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Comment grade.json on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'grade.json';
            if (fs.existsSync(path)) {
              const body = fs.readFileSync(path, 'utf8');
              const parsed = JSON.parse(body);
              const pretty = JSON.stringify(parsed, null, 2);
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: '## Autograder results\n```
' + pretty + '\n```'
              });
            } else {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: 'Autograder did not produce a grade.json file.'
              });
            }
